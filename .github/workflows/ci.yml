name: Post-Quantum Cryptography Dashboard CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-pqc-mlkem-dashboard

      - name: Checkout protocol repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-mlkem-protocol
          ref: main
          path: qmoosa-pqc-mlkem-protocol

      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-mlkem-engine
          ref: main
          path: qmoosa-pqc-mlkem-engine

      - name: Checkout sdk repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-mlkem-sdk
          ref: main
          path: qmoosa-pqc-mlkem-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: qmoosa-pqc-mlkem-dashboard/package.json

      - name: Install and build protocol dependency
        run: |
          cd qmoosa-pqc-mlkem-protocol
          npm install
          npm run build

      - name: Install and build engine dependency
        run: |
          cd qmoosa-pqc-mlkem-engine
          npm install
          npm run build

      - name: Install and build sdk dependency
        run: |
          cd qmoosa-pqc-mlkem-sdk
          npm install
          npm run build

      - name: Install dependencies in dashboard
        run: |
          cd qmoosa-pqc-mlkem-dashboard
          npm install

      - name: Build TypeScript
        run: |
          cd qmoosa-pqc-mlkem-dashboard
          npm run build

      - name: Run Dashboard Test Suite
        run: |
          cd qmoosa-pqc-mlkem-dashboard
          npm test

      - name: Static Type & Lint Check
        run: |
          cd qmoosa-pqc-mlkem-dashboard
          npm run lint
